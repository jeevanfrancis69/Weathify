<svg width="300" height="300" viewBox="0 0 300 300"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="300" height="300" fill="#1E293B"/>

  <!-- Subtle gradient overlay -->
  <rect width="300" height="300"
        fill="url(#grad)" opacity="0.4"/>

  <!-- Music note icon -->
  <g opacity="0.5">
    <!-- Note stem + flag -->
    <rect x="136" y="105" width="8" height="72" rx="4" fill="#7C3AED"/>
    <rect x="136" y="105" width="44" height="8" rx="4" fill="#7C3AED"/>
    <rect x="172" y="105" width="8" height="32" rx="4" fill="#7C3AED"/>

    <!-- Note head left -->
    <ellipse cx="128" cy="180" rx="16" ry="11"
             transform="rotate(-15 128 180)" fill="#7C3AED"/>

    <!-- Note head right -->
    <ellipse cx="164" cy="140" rx="16" ry="11"
             transform="rotate(-15 164 140)" fill="#8B5CF6"/>
  </g>

  <!-- Outer ring decoration -->
  <circle cx="150" cy="150" r="88"
          stroke="#7C3AED" stroke-width="1.5"
          stroke-dasharray="6 6" opacity="0.3"/>

  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>