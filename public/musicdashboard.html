<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weathify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/musicdashboard.css">
</head>
<body>

    <nav id="navbar">
        <div class="nav-logo">
            <!-- cloud-rain icon -->
            <svg viewBox="0 0 24 24"><path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/><line x1="8" y1="16" x2="8" y2="21"/><line x1="8" y1="21" x2="8" y2="21"/><line x1="12" y1="18" x2="12" y2="23"/><line x1="16" y1="16" x2="16" y2="21"/></svg>
            Weathify
        </div>
    </nav>

    <main class="app">
        <section class="now-playing">
            <div class="now-stack">
                <div class="cover" id="album-cover"></div>
                <div class="track-info">
                    <div id="track-title">Track Title</div>
                    <div id="track-artist">Artist Name</div>
                </div>
            </div>
        </section>

        <footer class="player-dashboard">
            <div class="player-controls">
                <button class="btn-previous">
                    <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
                </button>
                <button class="btn-main-play" id="btn-play">
                    <svg id="play-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <button class="btn-next">
                    <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
                </button>
            </div>
            <div class="progress-wrap">
                <span class="time" id="time-current">0:00</span>
                <div class="progress-bar">
                    <input type="range" min="0" max="100" value="0" class="progress-slider" id="progress-slider">
                </div>
                <span class="time" id="time-total">3:45</span>
            </div>
        </footer>
    </main>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script src="js/player.js"></script>
    <script src="js/musicdashboard.js" defer></script>
</body>
</html>
