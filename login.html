<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Weathify</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
        }
        .glass-card {
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="text-white selection:bg-violet-500/30 h-screen overflow-hidden flex flex-col">

    <!-- Background Glow Effects -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full h-[600px] bg-violet-600/10 blur-[130px] rounded-full pointer-events-none z-0"></div>
    <div class="fixed bottom-0 right-0 w-[500px] h-[500px] bg-blue-600/5 blur-[120px] rounded-full pointer-events-none z-0"></div>

    <!-- Minimal Navbar -->
    <nav class="w-full z-50 py-6 absolute top-0">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="mainpage.html" class="text-2xl font-bold tracking-tight text-white flex items-center gap-2 hover:opacity-90 transition-opacity">
                <i data-lucide="cloud-rain" class="w-6 h-6 text-violet-400"></i>
                Weathify
            </a>
            <a href="mainpage.html" class="text-sm font-medium text-gray-400 hover:text-white transition-colors flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Back to Home
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="relative z-10 flex-1 flex items-center justify-center p-6">
        <div class="w-full max-w-md glass-card rounded-2xl p-8 md:p-10 shadow-2xl animate-fade-in-up">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold mb-2">Welcome Back</h1>
                <p class="text-gray-400 text-sm">Enter your credentials to access your account</p>
            </div>

            <form class="space-y-5">
                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                        <input type="email" placeholder="hello@example.com" class="w-full bg-[#0A0A0A] border border-white/10 rounded-lg py-3 pl-12 pr-4 text-white placeholder-gray-600 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition-all">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                        <input type="password" placeholder="••••••••" class="w-full bg-[#0A0A0A] border border-white/10 rounded-lg py-3 pl-12 pr-4 text-white placeholder-gray-600 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition-all">
                    </div>
                    <div class="flex justify-end mt-2">
                        <a href="#" class="text-xs text-violet-400 hover:text-violet-300 transition-colors">Forgot Password?</a>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="button" class="w-full py-3.5 bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 rounded-lg font-semibold text-white shadow-lg shadow-violet-900/20 transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2">
                    Sign In
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-white/10 text-center">
                <p class="text-sm text-gray-400">
                    Don't have an account? 
                    <a href="signup.html" class="text-violet-400 hover:text-white font-medium transition-colors">Sign up</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
