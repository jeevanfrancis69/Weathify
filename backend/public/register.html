<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Weathify</title>
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- HEADER WITH LOGO (fixed top-left) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <header class="auth-header">
    <a href="/public" class="auth-header__logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M3 9C3 9 4.5 7 7 7C9.5 7 10.5 9 13 9C15.5 9 16.5 7 19 7C21.5 7 22 9 22 9"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M3 14C3 14 4.5 12 7 12C9.5 12 10.5 14 13 14C15.5 14 16.5 12 19 12C21.5 12 22 14 22 14"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Weathify</span>
    </a>
  </header>

  <div class="auth-container">
    
    <div class="auth-box">
      <!-- Logo section removed — now in header -->

      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Join Weathify to discover music that matches your weather</p>

      <div class="alert alert-error hidden" id="errorMessage"></div>
      <div class="alert alert-success hidden" id="successMessage"></div>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input
              type="text"
              id="username"
              name="username"
              placeholder="Choose a username"
              autocomplete="username"
              minlength="3"
              maxlength="30"
              pattern="[a-zA-Z0-9_\-]+"
              title="Username can only contain letters, numbers, underscore and hyphen"
          required>
          <small class="form-hint">3-30 characters, letters, numbers, - and _ only</small>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="your.email@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="full_name">Full Name <span class="optional">(optional)</span></label>
          <input
            type="text"
            id="full_name"
            name="full_name"
            placeholder="John Doe"
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a strong password"
            autocomplete="new-password"
            minlength="8"
            required
          >
          <small class="form-hint">Minimum 8 characters</small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign in</a>
      </div>
    </div>

  </div>

  <script src="/js/register.js"></script>
</body>
</html>
