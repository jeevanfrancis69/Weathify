
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href = "musicdashboard.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Fonts from Google-->     
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playwrite+DE+Grund:wght@100..400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full h-[500px] bg-violet-600/10 blur-[120px] rounded-full pointer-events-none z-0"></div>
    <div class="fixed bottom-0 right-0 w-[500px] h-[500px] bg-blue-600/5 blur-[120px] rounded-full pointer-events-none z-0"></div>

    <header>
    <nav id="navbar" class="w-full z-10 transition-all duration-300 py-2">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <div class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                <i data-lucide="cloud-rain" class="w-6 h-6 text-violet-400"></i>
                Weathify
            </div>
            <div class="search-bar" >
                <input type="text" placeholder="What do you want to listen to?">
            </div>
        </div>
    </nav>
    </header>


    
    <main class="app">
        <section class="now-playing" id="nowPlaying">
            <div class="now-stack">
                <div class="cover" id = "album-cover"></div>
                <div class="track-info">
                    <div id="track-title">Track Title</div>
                    <div id="track-artist">Artist Name</div>
                </div>
            </div>
        </section>
        
        <footer class="player-dashboard">
            <div class="player-controls">
                <button class="btn-previous">
                    <i data-lucide="skip-back"></i>
                </button>
                <button class="btn-play">
                    <i data-lucide="play"></i>
                </button>
                <button class="btn-next">
                    <i data-lucide="skip-forward"></i>
                </button>
            </div>
            <div class="progress-bar">
                <input type="range" min="0" max="100" value="0" class="progress-slider">
            </div>
        </footer>
    </main>
    <script>
        lucide.createIcons();
    </script>
    <script src="musicdashboard.js"></script>
</body>
</html>
